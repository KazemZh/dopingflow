name: Oxidation-state framework tests

on:
  pull_request:
    paths:
      - "src/dopingflow/oxidation.py"
      - "src/dopingflow/oxidation_structural.py"
      - "src/dopingflow/oxidation_ml.py"
      - "src/dopingflow/oxidation_dft.py"
      - "src/dopingflow/cli.py"
      - "tests/test_oxidation.py"
      - "docs/source/methods/oxidation_states.rst"
      - "docs/source/index.rst"
      - "docs/source/api/dopingflow.rst"
      - "pyproject.toml"
      - ".github/workflows/oxidation-tests.yml"
  workflow_dispatch:

jobs:
  oxidation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core, test, and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Compile oxidation modules
        run: |
          python -m py_compile \
            src/dopingflow/oxidation.py \
            src/dopingflow/oxidation_structural.py \
            src/dopingflow/oxidation_ml.py \
            src/dopingflow/oxidation_dft.py \
            src/dopingflow/cli.py

      - name: Run oxidation tests
        run: pytest -q tests/test_oxidation.py

      - name: Build Sphinx documentation
        run: sphinx-build -b html docs/source /tmp/dopingflow-docs-html
