name: Migrate legacy GPAW oxidation root

on:
  push:
    branches: [feature/oxidation-state-framework]
    paths: [.github/workflows/migrate-legacy-gpaw-root.yml]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply legacy output-root migration
        run: |
          python - <<'PY'
          from pathlib import Path

          # Core parser: migrate legacy saved config values so CLI and GUI-run commands
          # both reuse the new dft_oxidation location.
          path = Path('src/dopingflow/oxidation.py')
          text = path.read_text()
          marker = '''    if not isinstance(section, dict):\n        raise ValueError("[oxidation] must be a TOML table")\n\n'''
          insert = '''    if not isinstance(section, dict):\n        raise ValueError("[oxidation] must be a TOML table")\n\n    # Migrate the legacy GPAW output-root default saved by older GUI versions.\n    # This is intentionally limited to the former generated default name.\n    section = dict(section)\n    dft_settings = section.get("dft_electronic")\n    if isinstance(dft_settings, dict):\n        dft_settings = dict(dft_settings)\n        if str(dft_settings.get("output_root", "")).strip() == "gpaw_oxidation":\n            dft_settings["output_root"] = "dft_oxidation"\n        section["dft_electronic"] = dft_settings\n\n    bader_settings = section.get("bader")\n    if isinstance(bader_settings, dict):\n        bader_settings = dict(bader_settings)\n        if str(bader_settings.get("output_root", "")).strip() == "gpaw_oxidation":\n            inherited_root = "dft_oxidation"\n            current_dft = section.get("dft_electronic")\n            if isinstance(current_dft, dict):\n                inherited_root = str(current_dft.get("output_root") or inherited_root).strip()\n            bader_settings["output_root"] = inherited_root\n        section["bader"] = bader_settings\n\n'''
          assert marker in text, 'oxidation parser insertion point not found'
          path.write_text(text.replace(marker, insert, 1))

          # GUI: migrate before widgets are constructed so stale input.toml values do
          # not keep displaying gpaw_oxidation after an upgrade.
          path = Path('gui/pages/Oxidation_States.py')
          text = path.read_text()
          marker = '''cfg = toml.load(str(config_path))\noxidation = dict(cfg.get("oxidation", {}) or {})\n\n\n'''
          insert = '''cfg = toml.load(str(config_path))\noxidation = dict(cfg.get("oxidation", {}) or {})\n\n# Migrate the legacy GUI-generated GPAW output root. The migration is limited\n# to the old default name so unrelated custom paths remain untouched.\ndft_saved = oxidation.get("dft_electronic")\nif isinstance(dft_saved, dict):\n    dft_saved = dict(dft_saved)\n    if str(dft_saved.get("output_root", "")).strip() == "gpaw_oxidation":\n        dft_saved["output_root"] = "dft_oxidation"\n    oxidation["dft_electronic"] = dft_saved\n\nbader_saved = oxidation.get("bader")\nif isinstance(bader_saved, dict):\n    bader_saved = dict(bader_saved)\n    if str(bader_saved.get("output_root", "")).strip() == "gpaw_oxidation":\n        inherited_root = "dft_oxidation"\n        current_dft = oxidation.get("dft_electronic")\n        if isinstance(current_dft, dict):\n            inherited_root = str(current_dft.get("output_root") or inherited_root).strip()\n        bader_saved["output_root"] = inherited_root\n    oxidation["bader"] = bader_saved\n\n\n'''
          assert marker in text, 'GUI migration insertion point not found'
          path.write_text(text.replace(marker, insert, 1))

          # Regression test for old input.toml values and custom GPAW-root inheritance.
          path = Path('tests/test_oxidation.py')
          text = path.read_text()
          marker = '''def test_model_cache_loads_once_per_process() -> None:\n'''
          test = '''def test_legacy_gpaw_output_root_is_migrated(tmp_path: Path) -> None:\n    raw = {\n        "oxidation": {\n            "strategy": "dft",\n            "methods": ["bader"],\n            "dft_electronic": {"output_root": "gpaw_oxidation"},\n            "bader": {"output_root": "gpaw_oxidation"},\n        }\n    }\n    cfg = parse_oxidation_config(raw, tmp_path)\n    assert cfg.settings["dft_electronic"]["output_root"] == "dft_oxidation"\n    assert cfg.settings["bader"]["output_root"] == "dft_oxidation"\n\n    custom = {\n        "oxidation": {\n            "strategy": "dft",\n            "methods": ["bader"],\n            "dft_electronic": {"output_root": "my_dft_results"},\n            "bader": {"output_root": "gpaw_oxidation"},\n        }\n    }\n    cfg = parse_oxidation_config(custom, tmp_path)\n    assert cfg.settings["dft_electronic"]["output_root"] == "my_dft_results"\n    assert cfg.settings["bader"]["output_root"] == "my_dft_results"\n\n\n'''
          assert marker in text, 'test insertion point not found'
          path.write_text(text.replace(marker, test + marker, 1))

          # Remove this one-shot workflow from the resulting commit.
          Path('.github/workflows/migrate-legacy-gpaw-root.yml').unlink()
          PY
      - name: Verify implementation
        run: |
          python -m compileall -q src/dopingflow gui/pages/Oxidation_States.py
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,gui,docs]'
      - name: Run oxidation tests
        run: pytest -q tests/test_oxidation.py
      - name: Build documentation
        run: python -m sphinx -W -b html docs/source docs/_build/html
      - name: Commit validated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Migrate legacy GPAW oxidation output roots'
          git push origin HEAD:feature/oxidation-state-framework
