name: One-time oxidation output UX refactor

on:
  push:
    branches: [feature/oxidation-state-framework]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply refactor
        run: python tools/oxidation_output_ux_refactor.py

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
          python -m py_compile src/dopingflow/oxidation.py src/dopingflow/oxidation_structural.py gui/pages/Oxidation_States.py
          pytest -q tests/test_oxidation.py

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dopingflow/oxidation.py src/dopingflow/oxidation_structural.py gui/pages/Oxidation_States.py tests/test_oxidation.py docs/source/methods/oxidation_states.rst README.md
          git rm tools/oxidation_output_ux_refactor.py .github/workflows/oxidation-output-ux-refactor.yml
          git commit -m "Improve oxidation result organization and GUI browsing"
          git push origin HEAD:feature/oxidation-state-framework
