name: Remove conventional Bayesian TOSS

on:
  push:
    branches: [feature/oxidation-state-framework]

permissions:
  contents: write

jobs:
  remove-bayesian-toss:
    if: github.event.head_commit.message == 'Run conventional TOSS removal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply removal
        run: python tools/remove_toss_bayesian.py

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,docs]"
          python -m py_compile \
            src/dopingflow/oxidation.py \
            src/dopingflow/oxidation_structural.py \
            src/dopingflow/oxidation_ml.py \
            gui/pages/Oxidation_States.py
          pytest -q tests/test_oxidation.py
          sphinx-build -b html docs/source /tmp/dopingflow-docs-html

      - name: Commit validated removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dopingflow/oxidation.py src/dopingflow/oxidation_structural.py gui/pages/Oxidation_States.py tests/test_oxidation.py docs/source/methods/oxidation_states.rst README.md
          git rm tools/remove_toss_bayesian.py .github/workflows/remove-toss-bayesian.yml
          git commit -m "Remove conventional Bayesian TOSS oxidation method"
          git push origin HEAD:feature/oxidation-state-framework
