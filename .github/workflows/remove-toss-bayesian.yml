name: Remove conventional Bayesian TOSS

on:
  push:
    branches: [feature/oxidation-state-framework]

permissions:
  contents: write

jobs:
  remove-bayesian-toss:
    if: github.event.head_commit.message == 'Run conventional TOSS removal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply removal
        run: |
          # The primary script performs the substantive removal. Its final strict
          # scan intentionally catches any remaining mentions for this cleanup step.
          python tools/remove_toss_bayesian.py || true
          python - <<'PY'
          from pathlib import Path

          path = Path('src/dopingflow/cli.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('bond-valence,toss-bayesian,toss-gnn,', 'bond-valence,toss-gnn,')
          path.write_text(text, encoding='utf-8')

          path = Path('src/dopingflow/oxidation_ml.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Bayesian/MAP TOSS', 'traditional non-GNN TOSS')
          text = text.replace('MAP/Bayesian TOSS', 'traditional non-GNN TOSS')
          path.write_text(text, encoding='utf-8')

          path = Path('gui/pages/Oxidation_States.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('# Retired conventional Bayesian TOSS settings are ignored and removed on save.\noxidation.pop("toss_bayesian", None)\n', '')
          path.write_text(text, encoding='utf-8')

          needles = (
              'toss-bayesian', 'toss_bayesian', 'Bayesian/MAP TOSS',
              'MAP/Bayesian TOSS', 'conventional Bayesian TOSS', 'conventional TOSS',
          )
          problems = []
          for root in (Path('src'), Path('gui'), Path('docs'), Path('README.md')):
              files = [root] if root.is_file() else [p for p in root.rglob('*') if p.is_file()]
              for file in files:
                  try:
                      data = file.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for needle in needles:
                      if needle.lower() in data.lower():
                          problems.append((str(file), needle))
          if problems:
              raise SystemExit(f'retired conventional TOSS references remain: {problems}')
          PY

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,docs]"
          python -m py_compile \
            src/dopingflow/oxidation.py \
            src/dopingflow/oxidation_structural.py \
            src/dopingflow/oxidation_ml.py \
            src/dopingflow/cli.py \
            gui/pages/Oxidation_States.py
          pytest -q tests/test_oxidation.py
          sphinx-build -b html docs/source /tmp/dopingflow-docs-html

      - name: Commit validated removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dopingflow/oxidation.py src/dopingflow/oxidation_structural.py src/dopingflow/oxidation_ml.py src/dopingflow/cli.py gui/pages/Oxidation_States.py tests/test_oxidation.py docs/source/methods/oxidation_states.rst README.md
          git rm tools/remove_toss_bayesian.py .github/workflows/remove-toss-bayesian.yml
          git commit -m "Remove conventional Bayesian TOSS oxidation method"
          git push origin HEAD:feature/oxidation-state-framework

# one-time removal trigger v2
