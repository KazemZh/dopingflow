name: Document Wannier90 GPAW setup
# One-shot workflow to document the verified Conda installation path.

on:
  push:
    branches: [feature/oxidation-state-framework]
    paths: [.github/workflows/document-wannier90-setup.yml]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update README and oxidation documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('README.md'),
              Path('docs/source/methods/oxidation_states.rst'),
          ]
          install_old = 'conda install -c conda-forge gpaw gpaw-data'
          install_new = 'conda install -c conda-forge gpaw gpaw-data wannier90'
          for path in files:
              text = path.read_text(encoding='utf-8')
              if install_new not in text:
                  if install_old not in text:
                      raise SystemExit(f'GPAW Conda install command not found in {path}')
                  text = text.replace(install_old, install_new, 1)
              if 'command -v wannier90.x' not in text:
                  text, count = re.subn(
                      r'(?m)^(\s*)gpaw info\s*$',
                      lambda m: f'{m.group(1)}gpaw info\n{m.group(1)}command -v wannier90.x',
                      text,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit(f'gpaw info command not found in {path}')
              path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '`gpaw info` should complete successfully before starting a production GPAW\noxidation calculation.'
          extra = (' `wannier90` is installed in the same environment for the optional Wannier '
                   'analysis route; `command -v wannier90.x` should resolve its executable.')
          if 'optional Wannier analysis route' not in text:
              if marker not in text:
                  raise SystemExit('README GPAW explanation not found')
              text = text.replace(marker, marker + extra, 1)
          readme.write_text(text, encoding='utf-8')

          docs = Path('docs/source/methods/oxidation_states.rst')
          text = docs.read_text(encoding='utf-8')
          marker = ('``gpaw info`` should complete successfully\n'
                    'before production GPAW calculations are attempted.')
          extra = ('  Wannier90 is installed in the same environment for the optional Wannier '
                   'route; ``command -v wannier90.x`` should resolve the executable.')
          if 'optional Wannier route' not in text:
              if marker not in text:
                  raise SystemExit('Oxidation guide GPAW explanation not found')
              text = text.replace(marker, marker + extra, 1)
          docs.write_text(text, encoding='utf-8')

          # One-shot workflow: do not leave automation scaffolding in the feature branch.
          Path('.github/workflows/document-wannier90-setup.yml').unlink()
          PY
      - name: Verify documentation edits
        run: |
          grep -q 'gpaw gpaw-data wannier90' README.md
          grep -q 'command -v wannier90.x' README.md
          grep -q 'gpaw gpaw-data wannier90' docs/source/methods/oxidation_states.rst
          grep -q 'command -v wannier90.x' docs/source/methods/oxidation_states.rst
      - name: Install docs dependencies
        run: python -m pip install -e '.[docs]'
      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/_build/html
      - name: Commit documentation update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Document Wannier90 in GPAW oxidation environment'
          git push origin HEAD:feature/oxidation-state-framework
