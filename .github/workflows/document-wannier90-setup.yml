name: Document Wannier90 GPAW setup

on:
  push:
    branches: [feature/oxidation-state-framework]
    paths: [.github/workflows/document-wannier90-setup.yml]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update README and oxidation documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('README.md'),
              Path('docs/source/methods/oxidation_states.rst'),
          ]
          old = '''conda install -c conda-forge gpaw gpaw-data\npip install -e ".[gui]"\ngpaw info\n'''
          new = '''conda install -c conda-forge gpaw gpaw-data wannier90\npip install -e ".[gui]"\ngpaw info\ncommand -v wannier90.x\n'''
          for path in files:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected GPAW setup block not found in {path}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '''`gpaw info` should complete successfully before starting a production GPAW\noxidation calculation. The same `dopingflow_gpaw` environment can then be\nreused whenever the GPAW-backed oxidation page is needed.\n'''
          replacement = '''`gpaw info` should complete successfully before starting a production GPAW\noxidation calculation. `wannier90` is installed in the same environment for the\noptional Wannier analysis route; `command -v wannier90.x` should resolve its\nexecutable. The same `dopingflow_gpaw` environment can then be reused whenever\nthe GPAW-backed oxidation page is needed.\n'''
          if marker not in text:
              raise SystemExit('README explanatory paragraph not found')
          readme.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          docs = Path('docs/source/methods/oxidation_states.rst')
          text = docs.read_text(encoding='utf-8')
          marker = '''Run these commands from the dopingflow repository root for the editable\n``pip install`` and GUI launch.  ``gpaw info`` should complete successfully\nbefore production GPAW calculations are attempted.  Reuse the same\n``dopingflow_gpaw`` environment for subsequent GPAW-backed oxidation runs.\n'''
          replacement = '''Run these commands from the dopingflow repository root for the editable\n``pip install`` and GUI launch.  ``gpaw info`` should complete successfully\nbefore production GPAW calculations are attempted.  Wannier90 is installed in\nthe same environment for the optional Wannier route; ``command -v wannier90.x``\nshould resolve the executable.  Reuse the same ``dopingflow_gpaw`` environment\nfor subsequent GPAW-backed oxidation runs.\n'''
          if marker not in text:
              raise SystemExit('Oxidation guide explanatory paragraph not found')
          docs.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          # One-shot workflow: do not leave automation scaffolding in the feature branch.
          Path('.github/workflows/document-wannier90-setup.yml').unlink()
          PY
      - name: Verify documentation edits
        run: |
          grep -q 'gpaw gpaw-data wannier90' README.md
          grep -q 'command -v wannier90.x' README.md
          grep -q 'gpaw gpaw-data wannier90' docs/source/methods/oxidation_states.rst
          grep -q 'command -v wannier90.x' docs/source/methods/oxidation_states.rst
      - name: Install docs dependencies
        run: python -m pip install -e '.[docs]'
      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/_build/html
      - name: Commit documentation update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Document Wannier90 in GPAW oxidation environment'
          git push origin HEAD:feature/oxidation-state-framework
