name: Add Wannier descriptor analysis

on:
  push:
    branches:
      - feature/oxidation-state-framework
    paths:
      - .github/workflows/add-wannier-analysis.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Wannier descriptor analysis patch
        run: python .github/patch_wannier_analysis.py
      - name: Make GPAW electron metadata optional and add human WF number
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/dopingflow/oxidation_dft.py')
          text = p.read_text(encoding='utf-8')
          old = '''    return {
        "n_bands_total": int(calc.get_number_of_bands()),
        "n_occupied_bands": noccupied,
        "n_spins": nspins,
        "n_electrons": float(calc.get_number_of_electrons()),
'''
          new = '''    try:
        n_electrons = float(calc.get_number_of_electrons())
    except Exception:
        n_electrons = None

    return {
        "n_bands_total": int(calc.get_number_of_bands()),
        "n_occupied_bands": noccupied,
        "n_spins": nspins,
        "n_electrons": n_electrons,
'''
          if old not in text:
              raise SystemExit('Expected n_electrons return block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('src/dopingflow/wannier_analysis.py')
          text = p.read_text(encoding='utf-8')
          old = '''                "center_index": center_index,
                "cartesian_angstrom": cart_values,
'''
          new = '''                "center_index": center_index,
                "wannier_number": center_index + 1,
                "cartesian_angstrom": cart_values,
'''
          if old not in text:
              raise SystemExit('Expected center record block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify implementation compiles
        run: |
          python -m py_compile \
            src/dopingflow/wannier_analysis.py \
            src/dopingflow/oxidation_dft.py \
            src/dopingflow/oxidation.py \
            gui/pages/Oxidation_States.py \
            tests/test_oxidation.py
          grep -q 'wannier_centres_analysis.csv' src/dopingflow/wannier_analysis.py
          grep -q 'wannier_site_summary' src/dopingflow/oxidation_dft.py
          grep -q 'Parent-relative Wannier descriptor changes' gui/pages/Oxidation_States.py
          grep -q '"wannier_number": center_index + 1' src/dopingflow/wannier_analysis.py
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,gui,docs]' ase
      - name: Run oxidation tests
        run: pytest -q tests/test_oxidation.py
      - name: Build documentation
        run: python -m sphinx -b html docs/source /tmp/dopingflow-docs-html
      - name: Commit validated Wannier analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/patch_wannier_analysis.py .github/workflows/add-wannier-analysis.yml
          git add \
            src/dopingflow/wannier_analysis.py \
            src/dopingflow/oxidation_dft.py \
            src/dopingflow/oxidation.py \
            gui/pages/Oxidation_States.py \
            tests/test_oxidation.py \
            docs/source/methods/oxidation_states.rst \
            README.md \
            .github/workflows/oxidation-tests.yml
          git commit -m 'Add Wannier center descriptor analysis'
          git push origin HEAD:feature/oxidation-state-framework
