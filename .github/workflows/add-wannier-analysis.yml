name: Add Wannier descriptor analysis

on:
  push:
    branches:
      - feature/oxidation-state-framework
    paths:
      - .github/workflows/add-wannier-analysis.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Wannier descriptor analysis patch
        run: python .github/patch_wannier_analysis.py
      - name: Apply validation compatibility fixes
        run: python .github/fix_wannier_postpatch.py
      - name: Verify implementation compiles
        run: |
          python -m py_compile \
            src/dopingflow/wannier_analysis.py \
            src/dopingflow/oxidation_dft.py \
            src/dopingflow/oxidation.py \
            gui/pages/Oxidation_States.py \
            tests/test_oxidation.py
          grep -q 'wannier_centres_analysis.csv' src/dopingflow/wannier_analysis.py
          grep -q 'wannier_site_summary' src/dopingflow/oxidation_dft.py
          grep -q 'Parent-relative Wannier descriptor changes' gui/pages/Oxidation_States.py
          grep -q '"wannier_number": center_index + 1' src/dopingflow/wannier_analysis.py
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,gui,docs]'
      - name: Run oxidation tests
        run: pytest -q tests/test_oxidation.py
      - name: Build documentation
        run: python -m sphinx -b html docs/source /tmp/dopingflow-docs-html
      - name: Commit validated Wannier analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/patch_wannier_analysis.py \
            .github/fix_wannier_postpatch.py \
            .github/workflows/add-wannier-analysis.yml
          git add \
            src/dopingflow/wannier_analysis.py \
            src/dopingflow/oxidation_dft.py \
            src/dopingflow/oxidation.py \
            gui/pages/Oxidation_States.py \
            tests/test_oxidation.py \
            docs/source/methods/oxidation_states.rst \
            README.md
          git commit -m 'Add Wannier center descriptor analysis'
          git push origin HEAD:feature/oxidation-state-framework
