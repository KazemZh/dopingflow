name: Vacancy calibration tests

on:
  push:
    branches: ["debug/extended-energy-correction"]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "examples/vacancies/**"
      - "src/dopingflow/__init__.py"
      - "src/dopingflow/oxygen_calibration.py"
      - "src/dopingflow/vacancy_static_thermodynamics.py"
      - "src/dopingflow/vacancy_configurational_thermodynamics.py"
      - "src/dopingflow/vacancy_energy_correction_extensions.py"
      - "src/dopingflow/vacancy_analysis.py"
      - "src/dopingflow/vacancies.py"
      - "src/dopingflow/phase_diagram.py"
      - "src/dopingflow/phase_diagram_convergence_extensions.py"
      - "gui/gui_config.py"
      - "gui/app.py"
      - "gui/README.md"
      - "gui/phase_diagram_plots.py"
      - "gui/pages/Phase_Diagram.py"
      - "gui/pages/Vacancy_Energy_Correction.py"
      - "gui/vacancy_thermo_plots.py"
      - "docs/source/**"
      - "tests/test_oxygen_calibration.py"
      - "tests/test_vacancy_static_thermodynamics.py"
      - "tests/test_vacancy_configurational_thermodynamics.py"
      - "tests/test_vacancy_energy_correction.py"
      - "tests/test_vacancy_phase_diagram_extension.py"
      - "tests/test_phase_diagram_gui_plots.py"
      - "tests/test_phase_diagram_systems.py"
      - "tests/test_corrected_phase_diagram.py"
      - "tests/test_vacancies_gui.py"
      - ".github/workflows/vacancy-calibration-tests.yml"
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "examples/vacancies/**"
      - "src/dopingflow/__init__.py"
      - "src/dopingflow/oxygen_calibration.py"
      - "src/dopingflow/vacancy_static_thermodynamics.py"
      - "src/dopingflow/vacancy_configurational_thermodynamics.py"
      - "src/dopingflow/vacancy_energy_correction_extensions.py"
      - "src/dopingflow/vacancy_analysis.py"
      - "src/dopingflow/vacancies.py"
      - "src/dopingflow/phase_diagram.py"
      - "src/dopingflow/phase_diagram_convergence_extensions.py"
      - "gui/gui_config.py"
      - "gui/app.py"
      - "gui/README.md"
      - "gui/phase_diagram_plots.py"
      - "gui/pages/Phase_Diagram.py"
      - "gui/pages/Vacancy_Energy_Correction.py"
      - "gui/vacancy_thermo_plots.py"
      - "docs/source/**"
      - "tests/test_oxygen_calibration.py"
      - "tests/test_vacancy_static_thermodynamics.py"
      - "tests/test_vacancy_configurational_thermodynamics.py"
      - "tests/test_vacancy_energy_correction.py"
      - "tests/test_vacancy_phase_diagram_extension.py"
      - "tests/test_phase_diagram_gui_plots.py"
      - "tests/test_phase_diagram_systems.py"
      - "tests/test_corrected_phase_diagram.py"
      - "tests/test_vacancies_gui.py"
      - ".github/workflows/vacancy-calibration-tests.yml"
  workflow_dispatch:

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,corrections,gui,docs]"

      - name: Run vacancy calibration and phase-diagram GUI tests
        run: |
          python -m py_compile \
            gui/app.py \
            gui/phase_diagram_plots.py \
            gui/pages/Phase_Diagram.py \
            gui/pages/Vacancy_Energy_Correction.py \
            src/dopingflow/vacancy_configurational_thermodynamics.py \
            src/dopingflow/vacancy_energy_correction_extensions.py \
            src/dopingflow/phase_diagram_convergence_extensions.py
          pytest -q \
            tests/test_oxygen_calibration.py \
            tests/test_vacancy_static_thermodynamics.py \
            tests/test_vacancy_configurational_thermodynamics.py \
            tests/test_vacancy_energy_correction.py \
            tests/test_vacancy_phase_diagram_extension.py \
            tests/test_phase_diagram_gui_plots.py \
            tests/test_phase_diagram_systems.py \
            tests/test_corrected_phase_diagram.py \
            tests/test_vacancies_gui.py

      - name: Build Sphinx documentation
        run: |
          sphinx-build -b html docs/source /tmp/dopingflow-docs-html
