name: Apply vacancy configurational entropy patch

on:
  push:
    branches: ["debug/extended-energy-correction"]
    paths:
      - "scripts/apply_vacancy_configurational_entropy_patch.py"
      - ".github/workflows/apply-vacancy-configurational-entropy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: debug/extended-energy-correction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare one-shot patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_vacancy_configurational_entropy_patch.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("# ---------------------------------------------------------------------------\n# CI\n# ---------------------------------------------------------------------------")
          end = text.index("# ---------------------------------------------------------------------------\n# README and examples\n# ---------------------------------------------------------------------------", start)
          path.write_text(text[:start] + text[end:], encoding="utf-8")
          PY

      - name: Apply integration patch
        run: python scripts/apply_vacancy_configurational_entropy_patch.py

      - name: Preserve legacy static metadata for none mode
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/dopingflow/vacancy_configurational_thermodynamics.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          minima_replaced = 0
          metadata_line_removed = 0
          metadata_inserted = 0
          for line in lines:
              if line == '        line["static_lattice_approximation"] = approximation':
                  output.append('        if mode != "none":')
                  output.append('            line["static_lattice_approximation"] = approximation')
                  minima_replaced += 1
                  continue
              if line == '                "static_lattice_approximation": approximation,':
                  metadata_line_removed += 1
                  continue
              if line == '        metadata.update(':
                  output.append('        if mode != "none":')
                  output.append('            metadata["static_lattice_approximation"] = approximation')
                  metadata_inserted += 1
              output.append(line)
          if (minima_replaced, metadata_line_removed, metadata_inserted) != (1, 1, 1):
              raise RuntimeError(
                  f"Unexpected metadata anchors: minima={minima_replaced}, "
                  f"removed={metadata_line_removed}, inserted={metadata_inserted}"
              )
          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Syntax check changed Python files
        run: |
          python -m py_compile \
            src/dopingflow/vacancy_configurational_thermodynamics.py \
            src/dopingflow/vacancy_static_thermodynamics.py \
            gui/app.py \
            gui/gui_config.py \
            tests/test_vacancy_configurational_thermodynamics.py

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,corrections,gui]"

      - name: Run targeted vacancy tests
        run: |
          pytest -q \
            tests/test_oxygen_calibration.py \
            tests/test_vacancy_static_thermodynamics.py \
            tests/test_vacancy_configurational_thermodynamics.py \
            tests/test_vacancies_gui.py

      - name: Commit integrated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/dopingflow/vacancy_configurational_thermodynamics.py \
            src/dopingflow/vacancy_static_thermodynamics.py \
            gui/gui_config.py gui/app.py gui/README.md \
            tests/test_vacancies_gui.py tests/test_vacancy_configurational_thermodynamics.py \
            README.md CHANGELOG.md \
            examples/vacancies/input.toml examples/vacancies/README.md \
            docs/source/input_file.rst \
            docs/source/methods/vacancies.rst \
            docs/source/methods/oxygen_calibration.rst
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "Add configurational vacancy formation free energies"
            git push origin HEAD:debug/extended-energy-correction
          fi
