name: Dopant leaching tests

on:
  pull_request:
    paths:
      - "src/dopingflow/leaching.py"
      - "src/dopingflow/surface_staged.py"
      - "src/dopingflow/cli.py"
      - "tests/test_leaching.py"
      - "tests/test_surface_staged.py"
      - "gui/pages/Dopant_Leaching.py"
      - "examples/leaching/**"
      - "docs/source/methods/leaching.rst"
      - "docs/source/index.rst"
      - "docs/source/workflow_overview.rst"
  push:
    branches:
      - "feature/dopant-leaching"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "ase>=3.22"
          pip install -e ".[dev]"
      - name: Run leaching tests
        run: |
          python -m py_compile src/dopingflow/leaching.py
          if [ -f gui/pages/Dopant_Leaching.py ]; then python -m py_compile gui/pages/Dopant_Leaching.py; fi
          pytest -q tests/test_leaching.py tests/test_surface_staged.py tests/test_cli_help.py
