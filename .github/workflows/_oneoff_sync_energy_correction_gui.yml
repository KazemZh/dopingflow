name: One-off energy-correction GUI/docs sync

on:
  push:
    branches:
      - debug/extended-energy-correction
    paths:
      - .github/workflows/_oneoff_sync_energy_correction_gui.yml

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/extended-energy-correction
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded synchronization patch
        run: python .github/scripts/_oneoff_sync_energy_correction_gui.py

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit synchronized files and remove one-off helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_oneoff_sync_energy_correction_gui.yml
          git rm .github/scripts/_oneoff_sync_energy_correction_gui.py
          git add gui/app.py docs/source/input_file.rst docs/source/methods/references.rst gui/README.md
          git diff --cached --stat
          git commit -m "Sync energy-correction GUI and oxygen documentation"
          git push origin HEAD:debug/extended-energy-correction
