name: GPAW oxidation migration

on:
  push:
    branches: [feature/oxidation-state-framework]

permissions:
  contents: write

jobs:
  migrate-gpaw:
    if: github.event.head_commit.message == 'Run GPAW oxidation migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply GPAW migration
        run: python tools/replace_vasp_with_gpaw.py

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,docs]"

      - name: Compile oxidation modules and GUI
        run: |
          python -m py_compile \
            src/dopingflow/oxidation.py \
            src/dopingflow/oxidation_dft.py \
            src/dopingflow/cli.py \
            gui/pages/Oxidation_States.py

      - name: Run oxidation regression tests
        run: pytest -q tests/test_oxidation.py

      - name: Build oxidation documentation
        run: sphinx-build -b html docs/source /tmp/dopingflow-docs-html

      - name: Commit validated GPAW migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/dopingflow/oxidation_dft.py \
            gui/pages/Oxidation_States.py \
            pyproject.toml \
            tests/test_oxidation.py \
            README.md \
            docs/source/methods/oxidation_states.rst
          git rm tools/replace_vasp_with_gpaw.py .github/workflows/gpaw-oxidation-migration.yml
          git commit -m "Replace VASP oxidation backend with GPAW"
          git push origin HEAD:feature/oxidation-state-framework
