name: Set Bader grid default to two

on:
  push:
    branches: [feature/oxidation-state-framework]
    paths: [.github/workflows/set-bader-grid-default-two.yml]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Bader grid-refinement default
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('src/dopingflow/oxidation_dft.py')
          text = backend.read_text()
          old = 'gridrefinement = int(settings.get("gridrefinement", 4))'
          new = 'gridrefinement = int(settings.get("gridrefinement", 2))'
          assert old in text, 'backend Bader default not found'
          backend.write_text(text.replace(old, new, 1))

          gui = Path('gui/pages/Oxidation_States.py')
          text = gui.read_text()
          old = '''        grid_options = [1, 2, 4]\n        grid_current = int(bader.get("gridrefinement", 4))\n        if grid_current not in grid_options:\n            grid_current = 4\n'''
          new = '''        grid_options = [1, 2, 4]\n        grid_current = int(bader.get("gridrefinement", 2))\n        if grid_current not in grid_options:\n            grid_current = 2\n'''
          assert old in text, 'GUI Bader grid default block not found'
          gui.write_text(text.replace(old, new, 1))

          docs = Path('docs/source/methods/oxidation_states.rst')
          text = docs.read_text()
          old = '''   reported continuous partial charge is ``Z - N_Bader``; no POTCAR or\n   user-supplied valence-electron table is required.  Bader never emits an\n   integer formal oxidation state by itself.\n'''
          new = '''   reported continuous partial charge is ``Z - N_Bader``; no POTCAR or\n   user-supplied valence-electron table is required.  Bader never emits an\n   integer formal oxidation state by itself.  The GPAW all-electron-density\n   grid refinement defaults to ``2`` to limit memory use; ``1`` and ``4`` remain\n   available for convergence testing.\n'''
          assert old in text, 'Bader documentation paragraph not found'
          docs.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_oxidation.py')
          text = tests.read_text()
          old_import = 'import dopingflow.oxidation as oxidation\n'
          new_import = 'import dopingflow.oxidation as oxidation\nimport dopingflow.oxidation_dft as oxidation_dft\n'
          assert old_import in text, 'oxidation test import point not found'
          text = text.replace(old_import, new_import, 1)

          marker = 'def test_bader_is_descriptor_only_and_never_invents_integer_state(tmp_path: Path) -> None:\n'
          test = '''def test_bader_default_gridrefinement_is_two(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    structure = Structure(\n        Lattice.cubic(5.0),\n        ["Sn", "O"],\n        [[0.0, 0.0, 0.0], [0.5, 0.5, 0.5]],\n    )\n    structure_path = tmp_path / "POSCAR"\n    Poscar(structure).write_file(structure_path)\n    target = StructureTarget(\n        target_id="parent",\n        parent_id="parent",\n        kind="vacancy-free",\n        structure_path=structure_path,\n        n_vacancies=0,\n        vacancy_species=None,\n    )\n    cfg = _cfg(tmp_path)\n    workdir = tmp_path / "bader-default-grid"\n    workdir.mkdir()\n    (workdir / "oxidation.gpw").write_text("stub", encoding="utf-8")\n    captured: dict[str, int] = {}\n\n    def fake_density(gpw_path, density_path, *, gridrefinement):\n        del gpw_path\n        captured["gridrefinement"] = gridrefinement\n        density_path.write_text("stub density", encoding="utf-8")\n\n    class Completed:\n        returncode = 0\n        stdout = ""\n        stderr = ""\n\n    def fake_run(tokens, *, cwd, check, text, capture_output):\n        del tokens, check, text, capture_output\n        Path(cwd, "ACF.dat").write_text(\n            "# X Y Z CHARGE MIN_DIST ATOMIC_VOL\\n"\n            "---------------------------------------------\\n"\n            "1 0.0 0.0 0.0 49.60 0.50 10.0\\n"\n            "2 2.5 2.5 2.5 8.30 0.50 11.0\\n",\n            encoding="utf-8",\n        )\n        return Completed()\n\n    monkeypatch.setattr(oxidation_dft, "_write_gpaw_all_electron_density", fake_density)\n    monkeypatch.setattr(oxidation_dft.subprocess, "run", fake_run)\n    result = oxidation_dft.run_dft_method(\n        "bader",\n        target,\n        cfg,\n        {"workdir": str(workdir), "execute": True},\n    )\n    assert captured["gridrefinement"] == 2\n    assert result["assignment_status"] == "descriptors-only"\n\n\n'''
          assert marker in text, 'Bader regression-test insertion point not found'
          tests.write_text(text.replace(marker, test + marker, 1))

          Path('.github/workflows/set-bader-grid-default-two.yml').unlink()
          PY
      - name: Verify implementation
        run: |
          python -m compileall -q src/dopingflow gui/pages/Oxidation_States.py
          grep -n 'gridrefinement = int(settings.get("gridrefinement", 2))' src/dopingflow/oxidation_dft.py
          grep -n 'bader.get("gridrefinement", 2)' gui/pages/Oxidation_States.py
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,gui,docs]'
      - name: Run oxidation tests
        run: pytest -q tests/test_oxidation.py
      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/_build/html
      - name: Commit validated change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Use Bader grid refinement 2 by default'
          git push origin HEAD:feature/oxidation-state-framework
