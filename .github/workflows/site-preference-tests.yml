name: Dopant site-preference tests

on:
  push:
    branches:
      - feature/dopant-site-preference
    paths:
      - "src/dopingflow/site_preference.py"
      - "src/dopingflow/cli.py"
      - "tests/test_site_preference.py"
      - "gui/pages/Dopant_Site_Preference.py"
      - "examples/site_preference/**"
      - ".github/workflows/site-preference-tests.yml"
  pull_request:
    paths:
      - "src/dopingflow/site_preference.py"
      - "src/dopingflow/cli.py"
      - "tests/test_site_preference.py"
      - "gui/pages/Dopant_Site_Preference.py"
      - "examples/site_preference/**"
      - ".github/workflows/site-preference-tests.yml"
  workflow_dispatch:

jobs:
  site-preference-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Compile site-preference modules and GUI page
        run: |
          python -m py_compile \
            src/dopingflow/site_preference.py \
            src/dopingflow/cli.py \
            gui/pages/Dopant_Site_Preference.py

      - name: Run site-preference tests
        run: pytest -q tests/test_site_preference.py
