name: Fix GPAW 25 Wannier compatibility

on:
  push:
    branches:
      - feature/oxidation-state-framework
    paths:
      - .github/workflows/fix-gpaw25-wannier-import.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch GPAW Wannier import compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/dopingflow/oxidation_dft.py')
          text = p.read_text(encoding='utf-8')
          old = '''    try:\n        from gpaw.wannier.wannier90 import Wannier90\n    except ImportError as exc:\n        raise OptionalMethodUnavailable(\n            "Native Wannier execution requires GPAW's Wannier90 interface and the external wannier90.x executable."\n        ) from exc\n'''
          new = '''    try:\n        # GPAW >= 26.7 moved the interface into gpaw.wannier.wannier90.\n        from gpaw.wannier.wannier90 import Wannier90\n        gpaw_wannier_module = "gpaw.wannier.wannier90"\n    except ImportError:\n        try:\n            # GPAW 25.7 and earlier expose the same Wannier90 API here.\n            from gpaw.wannier90 import Wannier90\n            gpaw_wannier_module = "gpaw.wannier90"\n        except ImportError as exc:\n            raise OptionalMethodUnavailable(\n                "Native Wannier execution requires GPAW's Wannier90 Python interface. "\n                "The installed GPAW version does not expose a supported Wannier90 interface."\n            ) from exc\n'''
          if old not in text:
              raise SystemExit('Expected Wannier import block not found')
          text = text.replace(old, new, 1)

          old_meta = '''        "code": "GPAW+Wannier90",\n        "mode": "occupied-bloch",\n'''
          new_meta = '''        "code": "GPAW+Wannier90",\n        "gpaw_wannier_module": gpaw_wannier_module,\n        "mode": "occupied-bloch",\n'''
          if old_meta not in text:
              raise SystemExit('Expected Wannier metadata block not found')
          text = text.replace(old_meta, new_meta, 1)
          p.write_text(text, encoding='utf-8')

          # Document the compatibility explicitly.
          for filename in ['README.md', 'docs/source/methods/oxidation_states.rst']:
              path = Path(filename)
              doc = path.read_text(encoding='utf-8')
              marker = 'wannier90'
              if marker.lower() not in doc.lower():
                  continue
              note = ('\nThe native GPAW/Wannier90 adapter supports both the GPAW 25.7 '
                      '`gpaw.wannier90` interface and the newer '
                      '`gpaw.wannier.wannier90` interface.\n')
              if 'gpaw.wannier90` interface' not in doc:
                  doc += note
                  path.write_text(doc, encoding='utf-8')
          PY
      - name: Verify compatibility patch
        run: |
          python -m py_compile src/dopingflow/oxidation_dft.py
          grep -q 'from gpaw.wannier90 import Wannier90' src/dopingflow/oxidation_dft.py
          grep -q 'from gpaw.wannier.wannier90 import Wannier90' src/dopingflow/oxidation_dft.py
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,gui,docs]' ase
      - name: Run oxidation tests
        run: pytest -q tests/test_oxidation.py
      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/_build/html
      - name: Commit validated compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-gpaw25-wannier-import.yml
          git add src/dopingflow/oxidation_dft.py README.md docs/source/methods/oxidation_states.rst
          git commit -m 'Support GPAW 25.7 Wannier90 interface'
          git push origin HEAD:feature/oxidation-state-framework
