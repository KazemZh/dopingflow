name: Fix oxidation output root defaults

on:
  push:
    branches: [feature/oxidation-state-framework]
    paths: [.github/workflows/fix-oxidation-output-root.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply consistent dft_oxidation defaults
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('src/dopingflow/oxidation_dft.py')
          text = backend.read_text()
          old = 'root_raw = str(settings.get("output_root") or "gpaw_oxidation").strip()'
          new = 'root_raw = str(settings.get("output_root") or "dft_oxidation").strip()'
          assert old in text, 'backend gpaw_oxidation fallback not found'
          backend.write_text(text.replace(old, new, 1))

          gui = Path('gui/pages/Oxidation_States.py')
          text = gui.read_text()
          text = text.replace('value=str(settings.get("output_root", "gpaw_oxidation"))', 'value=str(settings.get("output_root", "dft_oxidation"))')
          text = text.replace('value=str(dft.get("output_root", "gpaw_oxidation"))', 'value=str(dft.get("output_root", "dft_oxidation"))')
          old_bader = 'value=str(bader.get("output_root", "gpaw_oxidation"))'
          assert old_bader in text, 'Bader GUI default not found'
          new_bader = 'value=str(bader.get("output_root", (_table("dft_electronic").get("output_root") or "dft_oxidation")))'
          text = text.replace(old_bader, new_bader, 1)
          gui.write_text(text)

          # Keep docs/examples consistent where the obsolete default is mentioned.
          for name in ['README.md', 'docs/source/methods/oxidation_states.rst', 'docs/source/input_file.rst']:
              path = Path(name)
              if path.exists():
                  path.write_text(path.read_text().replace('gpaw_oxidation', 'dft_oxidation'))

          # Remove this one-shot workflow from the resulting commit.
          Path('.github/workflows/fix-oxidation-output-root.yml').unlink()
          PY
      - name: Verify no obsolete default remains in oxidation implementation
        run: |
          ! grep -R "gpaw_oxidation" src/dopingflow/oxidation_dft.py gui/pages/Oxidation_States.py README.md docs/source/methods/oxidation_states.rst docs/source/input_file.rst
          python -m compileall -q src/dopingflow gui/pages/Oxidation_States.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev,gui]'
      - name: Run oxidation tests
        run: pytest -q tests/test_oxidation.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Use dft_oxidation for GPAW and Bader outputs'
          git push origin HEAD:feature/oxidation-state-framework
