name: Add oxidation target filter

on:
  push:
    branches:
      - feature/oxidation-state-framework
    paths:
      - .github/workflows/add-oxidation-target-filter.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply target-filter patch
        run: python .github/patch_target_filter.py

      - name: Verify patched files compile
        run: |
          grep -q 'target_include: tuple\[str, ...\]' src/dopingflow/oxidation.py
          grep -q 'Target selector(s) (optional)' gui/pages/Oxidation_States.py
          grep -q 'test_target_include_filters_exact_safe_and_glob_targets' tests/test_oxidation.py
          python -m py_compile src/dopingflow/oxidation.py gui/pages/Oxidation_States.py

      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,gui,docs]'

      - name: Run oxidation tests
        run: pytest -q tests/test_oxidation.py

      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/_build/html

      - name: Commit feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add oxidation target selection for focused DFT runs'
          git push origin HEAD:feature/oxidation-state-framework
