name: Add native GPAW Wannier workflow

on:
  push:
    branches: [feature/oxidation-state-framework]
    paths: [.github/workflows/add-native-wannier.yml]

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Implement native GPAW to Wannier90 occupied-manifold route
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'src/dopingflow/oxidation_dft.py'
          replace_once(path, 'import json\nimport math\nimport shlex\n', 'import json\nimport math\nimport os\nimport shlex\n')

          old = '''def _run_wannier(\n    target: StructureTarget,\n    cfg: OxidationConfig,\n    settings: dict[str, Any],\n) -> dict[str, Any]:\n    workdir = _maybe_execute(target, cfg, settings, stage="wannier")\n    centers_file = workdir / str(settings.get("centres_file", "wannier90_centres.xyz"))\n    if not centers_file.is_file():\n        raise OptionalMethodUnavailable(\n            f"Wannier analysis needs {centers_file}. Run Wannier90 externally or set execute=true with an explicit command."\n        )\n    centres = _parse_wannier_centres(centers_file)\n    result = base_method_result(\n        method="wannier",\n        target=target,\n        scope="site-resolved",\n        status="descriptors-only",\n        provenance={\n            "workdir": str(workdir),\n            "centres_file": str(centers_file),\n            "execute": bool(settings.get("execute", False)),\n            "n_wannier_centres": len(centres),\n        },\n        limitations=[\n            "Static Wannier-center information is supporting electronic evidence. It is not converted into formal integer oxidation states without an explicitly validated EOS/charge-pumping assignment procedure.",\n        ],\n    )\n    result["wannier_descriptors"] = centres\n    return result\n'''

          new = r'''def _occupied_gamma_manifold_info(
    calc: Any,
    *,
    occupation_tolerance: float,
    min_gap_eV: float,
) -> dict[str, Any]:
    """Validate the first native Wannier mode and identify its occupied manifold."""
    if occupation_tolerance <= 0 or occupation_tolerance >= 0.5:
        raise ValueError("[oxidation.wannier].occupation_tolerance must be between 0 and 0.5")
    if min_gap_eV < 0:
        raise ValueError("[oxidation.wannier].min_gap_eV must be >= 0")

    try:
        import numpy as np
    except ImportError as exc:
        raise OptionalMethodUnavailable("Native GPAW/Wannier analysis requires NumPy") from exc

    nspins = int(calc.get_number_of_spins())
    if nspins != 1:
        raise OptionalMethodUnavailable(
            "The native occupied-manifold Wannier mode currently supports non-spin-polarized GPAW results only."
        )

    try:
        bz_kpts = np.asarray(calc.get_bz_k_points(), dtype=float)
    except Exception:
        bz_kpts = np.asarray(calc.get_ibz_k_points(), dtype=float)
    if len(bz_kpts) != 1 or not np.allclose(bz_kpts[0], 0.0, atol=1.0e-10):
        raise OptionalMethodUnavailable(
            "The native occupied-manifold Wannier mode currently supports Gamma-only GPAW results."
        )

    occupations = np.asarray(calc.get_occupation_numbers(kpt=0, spin=0, raw=True), dtype=float)
    eigenvalues = np.asarray(calc.get_eigenvalues(kpt=0, spin=0), dtype=float)
    if len(occupations) != len(eigenvalues):
        raise RuntimeError("GPAW occupation/eigenvalue arrays have different lengths")

    partial = np.where(
        (occupations > occupation_tolerance)
        & (occupations < 1.0 - occupation_tolerance)
    )[0]
    if len(partial):
        raise OptionalMethodUnavailable(
            "The native occupied-manifold Wannier mode requires an isolated, integer-occupied manifold; "
            f"partially occupied bands were detected: {partial.tolist()}. Use an explicit projection/disentanglement workflow instead."
        )

    occupied = np.where(occupations >= 1.0 - occupation_tolerance)[0]
    if not len(occupied):
        raise RuntimeError("No fully occupied GPAW bands were found for Wannierization")
    noccupied = int(occupied[-1]) + 1
    if not np.array_equal(occupied, np.arange(noccupied)):
        raise OptionalMethodUnavailable(
            "The fully occupied GPAW bands are not a contiguous manifold starting from band 0."
        )
    if noccupied >= len(eigenvalues):
        raise OptionalMethodUnavailable(
            "At least one empty band is required to verify an insulating gap before native Wannierization."
        )

    gap = float(eigenvalues[noccupied] - eigenvalues[noccupied - 1])
    if gap < min_gap_eV:
        raise OptionalMethodUnavailable(
            f"The HOMO-LUMO gap is {gap:.6f} eV, below min_gap_eV={min_gap_eV:.6f}. "
            "Use an explicit disentanglement workflow for metallic/entangled states."
        )

    try:
        calc.get_pseudo_wave_function(band=0, kpt=0, spin=0)
    except Exception as exc:
        raise OptionalMethodUnavailable(
            "The GPAW restart does not expose stored wavefunctions. Re-run dft-electronic with "
            "save_wavefunctions=true so oxidation.gpw is written with mode='all'."
        ) from exc

    return {
        "n_bands_total": int(calc.get_number_of_bands()),
        "n_occupied_bands": noccupied,
        "n_spins": nspins,
        "homo_eV": float(eigenvalues[noccupied - 1]),
        "lumo_eV": float(eigenvalues[noccupied]),
        "gap_eV": gap,
        "fermi_level_eV": float(calc.get_fermi_level()),
        "occupation_tolerance": occupation_tolerance,
    }


def _write_gamma_bloch_wannier_input(
    path: Path,
    atoms: Any,
    *,
    noccupied: int,
    num_iter: int,
) -> None:
    if noccupied <= 0:
        raise ValueError("Wannier occupied-band count must be positive")
    if num_iter <= 0:
        raise ValueError("[oxidation.wannier].num_iter must be positive")

    lines = [
        f"num_bands = {noccupied}",
        f"num_wann = {noccupied}",
        "mp_grid = 1 1 1",
        "gamma_only = true",
        "use_bloch_phases = true",
        f"num_iter = {num_iter}",
        "write_xyz = true",
        "write_hr = true",
        "",
        "begin unit_cell_cart",
        "ang",
    ]
    for vector in atoms.cell.array:
        lines.append("  " + " ".join(f"{float(value):.12f}" for value in vector))
    lines.extend(["end unit_cell_cart", "", "begin atoms_frac"])
    for symbol, frac in zip(atoms.get_chemical_symbols(), atoms.get_scaled_positions(wrap=False)):
        lines.append(
            f"{symbol} " + " ".join(f"{float(value):.12f}" for value in frac)
        )
    lines.extend(
        [
            "end atoms_frac",
            "",
            "begin kpoints",
            "0.000000000000 0.000000000000 0.000000000000",
            "end kpoints",
            "",
        ]
    )
    path.write_text("\n".join(lines), encoding="utf-8")


def _run_native_gpaw_wannier(
    target: StructureTarget,
    cfg: OxidationConfig,
    settings: dict[str, Any],
) -> tuple[Path, dict[str, Any]]:
    workdir = _workdir(target, cfg, settings)
    workdir.mkdir(parents=True, exist_ok=True)
    gpw_path = workdir / str(settings.get("gpw_file", "oxidation.gpw"))
    if not gpw_path.is_file():
        raise OptionalMethodUnavailable(
            f"Native Wannier execution needs the GPAW restart {gpw_path}. Run dft-electronic first "
            "with the same output_root/workdir and save_wavefunctions=true."
        )

    try:
        from gpaw.wannier.wannier90 import Wannier90
    except ImportError as exc:
        raise OptionalMethodUnavailable(
            "Native Wannier execution requires GPAW's Wannier90 interface and the external wannier90.x executable."
        ) from exc

    atoms, calc = _gpaw_restart(gpw_path)
    occupation_tolerance = float(settings.get("occupation_tolerance", 1.0e-4))
    min_gap_eV = float(settings.get("min_gap_eV", 1.0e-3))
    manifold = _occupied_gamma_manifold_info(
        calc,
        occupation_tolerance=occupation_tolerance,
        min_gap_eV=min_gap_eV,
    )
    noccupied = int(manifold["n_occupied_bands"])
    num_iter = int(settings.get("num_iter", 1000))
    seed = str(settings.get("seed", "wannier90")).strip() or "wannier90"
    if Path(seed).name != seed:
        raise ValueError("[oxidation.wannier].seed must be a simple filename stem")
    executable = str(settings.get("executable", "wannier90.x")).strip() or "wannier90.x"
    less_memory = bool(settings.get("less_memory", False))

    centers_file = workdir / str(settings.get("centres_file", f"{seed}_centres.xyz"))
    if centers_file.exists():
        centers_file.unlink()

    old_cwd = Path.cwd()
    try:
        os.chdir(workdir)
        w90 = Wannier90(
            calc,
            seed=seed,
            bands=range(noccupied),
            orbitals_ai=[[] for _ in atoms],
            spin=0,
            spinors=False,
        )
        _write_gamma_bloch_wannier_input(
            Path(f"{seed}.win"),
            atoms,
            noccupied=noccupied,
            num_iter=num_iter,
        )

        try:
            pp = subprocess.run(
                [executable, "-pp", seed],
                check=False,
                text=True,
                capture_output=True,
            )
        except FileNotFoundError as exc:
            raise OptionalMethodUnavailable(
                f"Wannier90 executable '{executable}' was not found. Install it with "
                "`conda install -c conda-forge wannier90` or configure [oxidation.wannier].executable."
            ) from exc
        Path("dopingflow_wannier_pp_stdout.txt").write_text(pp.stdout or "", encoding="utf-8")
        Path("dopingflow_wannier_pp_stderr.txt").write_text(pp.stderr or "", encoding="utf-8")
        if pp.returncode != 0:
            raise RuntimeError(
                f"wannier90 preprocessing failed with exit code {pp.returncode}; "
                "see dopingflow_wannier_pp_stderr.txt"
            )

        # use_bloch_phases=true means Wannier90 constructs the initial A matrix
        # directly from the Bloch states, so an .amn projection file is not needed.
        w90.write_eigenvalues()
        w90.write_overlaps(less_memory=less_memory)

        final = subprocess.run(
            [executable, seed],
            check=False,
            text=True,
            capture_output=True,
        )
        Path("dopingflow_wannier_stdout.txt").write_text(final.stdout or "", encoding="utf-8")
        Path("dopingflow_wannier_stderr.txt").write_text(final.stderr or "", encoding="utf-8")
        if final.returncode != 0:
            raise RuntimeError(
                f"wannier90 failed with exit code {final.returncode}; see dopingflow_wannier_stderr.txt"
            )
    finally:
        os.chdir(old_cwd)

    if not centers_file.is_file():
        raise RuntimeError(
            f"Wannier90 completed without producing the expected centres file {centers_file}"
        )

    metadata = {
        "code": "GPAW+Wannier90",
        "mode": "occupied-bloch",
        "workdir": str(workdir),
        "gpw_file": str(gpw_path),
        "seed": seed,
        "centres_file": str(centers_file),
        "executable": executable,
        "num_iter": num_iter,
        "less_memory": less_memory,
        **manifold,
    }
    (workdir / "wannier_run_metadata.json").write_text(
        json.dumps(metadata, indent=2, sort_keys=True), encoding="utf-8"
    )
    return centers_file, metadata


def _run_wannier(
    target: StructureTarget,
    cfg: OxidationConfig,
    settings: dict[str, Any],
) -> dict[str, Any]:
    workdir = _workdir(target, cfg, settings)
    execution_mode = str(settings.get("execution_mode", "native-gpaw")).strip().lower()
    metadata: dict[str, Any] = {}

    if bool(settings.get("execute", False)):
        if execution_mode == "native-gpaw":
            centers_file, metadata = _run_native_gpaw_wannier(target, cfg, settings)
        elif execution_mode == "external-command":
            workdir = _maybe_execute(target, cfg, settings, stage="wannier")
            centers_file = workdir / str(settings.get("centres_file", "wannier90_centres.xyz"))
        else:
            raise ValueError(
                "[oxidation.wannier].execution_mode must be native-gpaw or external-command"
            )
    else:
        centers_file = workdir / str(settings.get("centres_file", "wannier90_centres.xyz"))

    if not centers_file.is_file():
        raise OptionalMethodUnavailable(
            f"Wannier analysis needs {centers_file}. Enable native GPAW Wannier execution, "
            "run Wannier90 externally, or point workdir/output_root to existing centers."
        )
    centres = _parse_wannier_centres(centers_file)
    provenance = {
        "workdir": str(workdir),
        "centres_file": str(centers_file),
        "execute": bool(settings.get("execute", False)),
        "execution_mode": execution_mode,
        "n_wannier_centres": len(centres),
    }
    provenance.update(metadata)
    result = base_method_result(
        method="wannier",
        target=target,
        scope="site-resolved",
        status="descriptors-only",
        provenance=provenance,
        limitations=[
            "Static Wannier-center information is supporting electronic evidence. It is not converted into formal integer oxidation states without an explicitly validated EOS/charge-pumping assignment procedure.",
            "The native occupied-bloch mode currently supports isolated non-spin-polarized Gamma-only occupied manifolds; metallic, spin-polarized, or entangled cases require an explicit projection/disentanglement workflow.",
        ],
    )
    result["wannier_descriptors"] = centres
    return result
'''
          replace_once(path, old, new)

          # GUI: replace generic Wannier external-command panel with native controls.
          gui = 'gui/pages/Oxidation_States.py'
          old_gui = '''if "wannier" in methods:\n    with st.expander("Wannier descriptors", expanded=False):\n        dft_method_panel(\n            "wannier",\n            "wannier",\n            extra="Static Wannier centers are retained as descriptors and are not automatically converted to formal oxidation states.",\n        )\n        wannier = _table("wannier")\n        wannier["centres_file"] = st.text_input(\n            "Wannier centres file",\n            value=str(wannier.get("centres_file", "wannier90_centres.xyz")),\n        )\n        oxidation["wannier"] = wannier\n'''
          new_gui = '''if "wannier" in methods:\n    with st.expander("GPAW + Wannier90 descriptors", expanded=False):\n        wannier = _table("wannier")\n        inherited_root = _table("dft_electronic").get("output_root") or "dft_oxidation"\n        wannier["output_root"] = st.text_input(\n            "Per-target GPAW/Wannier output root",\n            value=str(wannier.get("output_root") or inherited_root),\n            key="oxidation_wannier_root",\n            help="Use the same root as dft-electronic so Wannier can reuse oxidation.gpw.",\n        )\n        wannier["execute"] = st.checkbox(\n            "Generate Wannier centres from the GPAW restart",\n            value=bool(wannier.get("execute", False)),\n            key="oxidation_wannier_execute",\n            help="Requires oxidation.gpw written with stored wavefunctions and the wannier90.x executable.",\n        )\n        mode_options = ["native-gpaw", "external-command"]\n        current_mode = str(wannier.get("execution_mode", "native-gpaw")).lower()\n        if current_mode not in mode_options:\n            current_mode = "native-gpaw"\n        wannier["execution_mode"] = st.selectbox(\n            "Wannier execution mode",\n            mode_options,\n            index=mode_options.index(current_mode),\n            help="native-gpaw currently handles isolated non-spin-polarized Gamma-only occupied manifolds without disentanglement.",\n        )\n        w1, w2, w3 = st.columns(3)\n        wannier["gpw_file"] = w1.text_input(\n            "GPAW restart file", value=str(wannier.get("gpw_file", "oxidation.gpw"))\n        )\n        wannier["seed"] = w2.text_input(\n            "Wannier90 seed", value=str(wannier.get("seed", "wannier90"))\n        )\n        wannier["executable"] = w3.text_input(\n            "Wannier90 executable", value=str(wannier.get("executable", "wannier90.x"))\n        )\n        w4, w5, w6 = st.columns(3)\n        wannier["num_iter"] = int(w4.number_input(\n            "Wannier localization iterations", min_value=1, value=int(wannier.get("num_iter", 1000)), step=100\n        ))\n        wannier["occupation_tolerance"] = float(w5.number_input(\n            "Occupation tolerance", min_value=1.0e-8, max_value=0.1, value=float(wannier.get("occupation_tolerance", 1.0e-4)), format="%.1e"\n        ))\n        wannier["min_gap_eV"] = float(w6.number_input(\n            "Minimum insulating gap (eV)", min_value=0.0, value=float(wannier.get("min_gap_eV", 1.0e-3)), format="%.3e"\n        ))\n        wannier["less_memory"] = st.checkbox(\n            "Low-memory GPAW overlap generation",\n            value=bool(wannier.get("less_memory", False)),\n            help=(\n                "Useful for multi-k calculations, but for the current single Gamma-point route it can duplicate "\n                "wavefunction arrays and may be slower or use more peak memory. Leave off for Gamma-only unless needed."\n            ),\n        )\n        default_centres = f"{wannier['seed']}_centres.xyz"\n        wannier["centres_file"] = st.text_input(\n            "Wannier centres file",\n            value=str(wannier.get("centres_file", default_centres)),\n        )\n        if wannier["execution_mode"] == "external-command":\n            command_text = st.text_input(\n                "External Wannier command",\n                value=_command_text(wannier.get("command", [])),\n                disabled=not wannier["execute"],\n                help="Legacy/custom route. The native GPAW route does not need this field.",\n            )\n            wannier["command"] = _parse_command(command_text)\n            if wannier["execute"] and not wannier["command"]:\n                st.error("wannier: external-command mode requires a command when execution is enabled.")\n        else:\n            wannier.pop("command", None)\n            st.info(\n                "Native mode detects all fully occupied bands, verifies a finite gap, uses Bloch phases as the "\n                "initial gauge (no arbitrary atomic projection choice), writes .eig/.mmn through GPAW, runs "\n                "wannier90.x, and expects the resulting *_centres.xyz file."\n            )\n        st.caption(\n            "Static Wannier centers remain descriptors only. Formal oxidation states require a validated EOS/charge-pumping procedure."\n        )\n        oxidation["wannier"] = wannier\n'''
          replace_once(gui, old_gui, new_gui)

          # Tests for manifold detection and input generation without requiring GPAW/Wannier90 in CI.
