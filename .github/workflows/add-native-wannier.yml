name: Add native GPAW Wannier workflow

on:
  push:
    branches:
      - feature/oxidation-state-framework
    paths:
      - .github/workflows/add-native-wannier.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oxidation-state-framework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply native Wannier patch
        run: python .github/scripts/patch_native_wannier.py
      - name: Verify patched files compile
        run: |
          python -m py_compile src/dopingflow/oxidation_dft.py gui/pages/Oxidation_States.py
          grep -q '_run_native_gpaw_wannier' src/dopingflow/oxidation_dft.py
          grep -q 'use_bloch_phases = true' src/dopingflow/oxidation_dft.py
          grep -q 'GPAW + Wannier90 descriptors' gui/pages/Oxidation_States.py
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev,gui,docs]'
      - name: Run oxidation tests
        run: pytest -q tests/test_oxidation.py
      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/_build/html
      - name: Commit native Wannier implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add native GPAW Wannier90 occupied-manifold workflow'
          git push origin HEAD:feature/oxidation-state-framework
