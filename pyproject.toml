[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dopingflow"
version = "0.1.0"
description = "ML-driven doping workflow pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kazem Zhour" }]

dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pymatgen>=2024.2.8",
  "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
m3gnet = [
  "m3gnet==0.2.4",
  "tensorflow==2.15.1",
  "numpy==1.26.4",
  "ase==3.22.1",
]

uma = [
  "fairchem-core>=2.19; python_version>='3.11'",
  "numpy>=2.0,<2.5; python_version>='3.11'",
  "ase>=3.26.0; python_version>='3.11'",
]

mace = [
  "mace-torch>=0.3.14",
]

grace = [
  "tensorpotential",
]

mp = [
  "mp-api>=0.40",
]

corrections = [
  "matminer>=0.10.1,<0.11; python_version>='3.11'",
  "matminer>=0.9.3,<0.10; python_version<'3.11'",
  "mp-api>=0.40",
]

alignn = [
  "torch==2.1.2",
  "dgl==1.1.2",
  "alignn==2024.12.12",
  "jarvis-tools==2024.3.4",
  "pyparsing==2.4.7",
]

oxidation-toss = [
  "torch>=2.0",
  "torch-geometric>=2.3",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "scipy>=1.10",
]

oxidation-chgnet = [
  "chgnet>=0.3.0",
]

oxidation-bertos = [
  "torch>=2.0",
  "transformers>=4.30",
]

# GPAW is intentionally not declared as a pip optional dependency. On Linux,
# pip commonly builds GPAW from source and therefore requires MPI/compiler
# development headers. The [tool.pixi] configuration below provides a binary
# conda-forge GPAW + gpaw-data + Bader + GUI environment from this same file.

dev = [
  "pytest>=8",
  "ruff>=0.5",
]

docs = [
  "sphinx>=7",
  "sphinx-rtd-theme",
  "myst-parser",
]

gui = [
  "streamlit>=1.32",
  "pandas>=2.0,<3",
  "toml>=0.10.2",
  "plotly>=5.18",
  "kaleido>=0.2.1",
  "py3Dmol",
]

[project.scripts]
dopingflow = "dopingflow.cli:app"

# Pixi reads this same pyproject.toml and can combine conda-forge binary
# dependencies with the native Python extras above.  The `gui` feature comes
# from [project.optional-dependencies].gui; `gpaw-gui` combines it with the
# compiled GPAW/Bader stack below.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.feature.gpaw.dependencies]
gpaw = ">=25.7,<26"
gpaw-data = ">=1.0.1"
bader = ">=1.0.5"

[tool.pixi.feature.gpaw.tasks]
gpaw-info = "gpaw info"
oxidation-gui = "streamlit run gui/app.py"

[tool.pixi.environments]
gpaw-gui = ["gpaw", "gui"]

[tool.setuptools]
package-dir = {"" = "src" }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
