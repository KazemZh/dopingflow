[surface]
enabled = true
# Same structure-selection interface used by oxidation/conductivity.
source_root = "vacancy-selected"
include_vacancy_free = true
include_oxygen_vacancies = false
target_include = []

# SnO2 low-index starting set. Change or extend for another host.
orientation_mode = "explicit"
miller_list = [
  [1, 1, 0],
  [1, 0, 0],
  [1, 0, 1],
  [0, 0, 1],
]
max_orientations = 8
min_slab_size = 12.0
min_vacuum_size = 15.0
center_slab = true
orthogonal_c = true
termination_mode = "all"
max_terminations_per_orientation = 12
symmetrize_slabs = false

# Enumerate representative co-dopant depth placements while preserving composition.
dopant_variant_mode = "co-dopant-depth"
host_species = "Sn"
dopant_species = ["Sb", "Ti"]  # replace Ti by the chosen co-dopant
anion_species = ["O"]
depth_zones = ["surface", "subsurface", "bulk"]
placement_side = "top"
layers_per_zone = 1
cation_layer_tolerance_A = 0.8
include_original_variant = true
max_dopant_variants_per_termination = 18

# Optional structural constraints during slab relaxation.
fix_atoms = true
fix_region = "middle"
fix_method = "layers"
fix_n_layers = 2
fix_layer_tolerance_A = 0.6

outdir = "08_surfaces"  # relative -> <source_root>/08_surfaces
max_total_surfaces = 1000

[surface.screen]
# Fast first-pass model.
backend = "grace"
model = "GRACE-1L-OMAT"
task = ""
device = "cuda"
gpu_id = 0
relax = true
optimizer = "bfgs"
fmax = 0.05
max_steps = 300
[surface.refine]
# Optional higher-fidelity second model. Any supported MLFF may be selected.
enabled = true
backend = "mace"
model = "mh-1"
task = "matpes_r2scan"
device = "cuda"
gpu_id = 0
relax = true
optimizer = "bfgs"
fmax = 0.03
max_steps = 500

# Choose which screened surfaces are sent to refinement.
# "global": best N overall.
# "per_orientation": best N separately for every Miller orientation.
# "orientation_termination": preserve both orientation and termination diversity.
selection_mode = "orientation_termination"

# Defaults for orientation_termination when no orientation-specific override exists.
default_terminations_per_orientation = 3
default_variants_per_termination = 1

# Optional exact manual changes applied after the automatic shortlist.
manual_include_surface_ids = []
manual_exclude_surface_ids = []

# Keep every successfully refined surface by default.
final_selection_mode = "all"

[surface.refine.orientation_limits."1,0,0"]
terminations = 3
variants_per_termination = 2

[surface.refine.orientation_limits."1,1,0"]
terminations = 3
variants_per_termination = 2

[surface.refine.orientation_limits."1,0,1"]
terminations = 3
variants_per_termination = 1

[surface.refine.orientation_limits."0,0,1"]
terminations = 2
variants_per_termination = 1
