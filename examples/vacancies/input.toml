[structure]
outdir = "random_structures"

# Optional backend-specific M0/M1 correction used by formation/phase-diagram
# analysis and, when explicitly enabled below, by vacancy thermodynamics.
# Keep this disabled for a raw vacancy-only example. To use it, set enabled=true,
# run `dopingflow corrections-fit -c input.toml`, and then enable
# apply_fitted_energy_correction in [vacancies].
[energy_correction]
enabled = false
experimental_source = "kingsbury"
model_family = "auto"
correction_terms = ["oxide"]
m1_elements = "workflow"
calibration_selection = "phase_resolved"
auto_fetch_phase_structures = true
reuse_fitted = true

[vacancies]
enabled = true
parent_source = "selected_candidates"
include_parent_reference = true
skip_if_done = true
resume = true
count_mode = "all_reachable"
host_species = "Sn"
host_oxidation_state = 4
vacancy_species = "O"
vacancy_compensation_charge = 2
oxidation_state_elements = ["Sb", "Nb"]
oxidation_state_values = [[3, 5], [5]]
extra_vacancies = 0
max_vacancies_cap = 8
# Optional research-design override. When present, these exact positive counts
# are searched instead of deriving a continuous range from formal charges.
# vacancy_counts = [1, 2]
search_method = "enumeration"
supercell = [1, 1, 1]
symprec = 1.0e-3
angle_tolerance = 5.0
mapping_tolerance = 1.0
enumeration_mode = "auto"
max_exact_raw_configs = 300000
max_exact_unique_configs = 100000
sample_budget = 20000
sample_batch_size = 256
sample_patience = 4000
sample_seed = 42
sample_max_saved = 50000
minimum_vacancy_distance = 0.0

# Alternative occupation search:
# search_method = "monte-carlo"
# mc_temperature_K = 300.0
# mc_annealing = false
# Set mc_annealing=true to enable the high-temperature schedule below.
# mc_initial_temperature_K = 1200.0
# mc_annealing_hold_steps = 500
# mc_annealing_steps = 2000
# mc_run_mode = "combined"  # fixed, converged, or combined
# mc_max_steps = 10000
# mc_patience = 2000
# mc_improvement_tolerance_eV = 1.0e-5
# mc_energy_window_eV = 0.5
# mc_cation_move_weight = 0.5
# mc_vacancy_move_weight = 0.5
# Monte Carlo reuses sample_seed and sample_max_saved above.
#
# Optional fast calculator used only for Metropolis search energies. If these
# keys are omitted, Monte Carlo inherits the final calculator below. A typical
# mixed-backend search uses GRACE for MC and MACE for final top-k relaxation:
# mc_backend = "grace"
# mc_model = "GRACE-1L-OMAT"
# mc_task = ""
# mc_device = "cuda"
# mc_gpu_id = 0

# Final calculator. It remains authoritative for parent consistency energies,
# final top-k relaxations, thermodynamic analysis, and correction provenance.
backend = "mace"
model = "medium-mpa-0"
task = ""
device = "cuda"
gpu_id = 0
n_workers = 1
tf_threads = 1
omp_threads = 1
chunksize = 25
topk_per_vacancy_count = 15
energy_normalization = "per_vacancy"
optimizer = "bfgs"
fmax = 0.05
max_steps = 300
relax_mode = "atoms"
cell_filter = "frechet"

# Level-1 vacancy thermodynamics.
static_thermodynamic_analysis = true

# Optional M0/M1 correction of the solid parent/defect energies. This reuses
# the already fitted [energy_correction] model; it does not fit a second model.
apply_fitted_energy_correction = false
allow_legacy_energy_correction_provenance = false

# Backward-compatible raw O2 reference from refs-build. This raw same-backend
# mode is the recommended oxygen reservoir when M0/M1 vacancy correction is on.
oxygen_reference_mode = "reference_file"
oxygen_reference_file = "reference_structures/reference_energies.json"
oxygen_reference_structure = "reference_structures/gas/O2.POSCAR"
oxygen_reference_relax = false
allow_unverified_oxygen_reference = false

# To fit the oxygen reference from real reference oxides + experimental 298 K
# formation enthalpies, replace the mode above with either:
# oxygen_reference_mode = "global"
# oxygen_reference_mode = "chemistry-specific"
# IMPORTANT: these two calibrated oxygen-reference modes are mutually exclusive
# with apply_fitted_energy_correction=true because both use experimental
# formation-enthalpy information and would double count oxygen calibration.
# The calibrated modes require the refs-build backend/model/task to match this
# vacancy calculator and require the optional `corrections` dependency for the
# default Kingsbury experimental dataset.
oxygen_calibration_experimental_source = "kingsbury"
oxygen_calibration_experimental_data = ""
oxygen_calibration_dataset_cache_dir = ""
oxygen_calibration_min_references = 2
oxygen_calibration_include_host_oxide = true

# Optional solid vacancy configurational treatment for finite-T free energies:
# "none" = static lattice; "ideal" = ideal occupied/vacant mixing;
# "configurational" = canonical partition function over exact symmetry orbits.
# The configurational mode requires exact enumeration/degeneracies.
solid_configurational_entropy = "none"

delta_mu_O_min_eV = -3.0
delta_mu_O_max_eV = 0.0
delta_mu_O_points_eV = [0.0, -0.5, -1.0, -1.5, -2.0, -2.5, -3.0]
thermodynamic_tolerance_eV = 1.0e-8
static_energy_source = "relaxed_only"
exclude_unconverged = true
pressure_mapping = true
temperatures_K = [300.0, 600.0, 900.0, 1200.0, 1500.0]
standard_oxygen_pressure_bar = 1.0
log10_pO2_min_bar = -30.0
log10_pO2_max_bar = 1.0
log10_pO2_step = 0.5
oxygen_standard_state_mode = "nist_shomate"
oxygen_standard_state_temperatures_K = []
oxygen_standard_state_delta_mu_eV_per_O = []
