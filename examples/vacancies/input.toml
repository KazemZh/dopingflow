[structure]
outdir = "random_structures"

# Optional backend-specific fitted energy correction. The staged vacancy example
# keeps this disabled so the example can be used without a prior corrections-fit.
[energy_correction]
enabled = false
experimental_source = "kingsbury"
model_family = "auto"
correction_terms = ["oxide"]
m1_elements = "workflow"
calibration_selection = "phase_resolved"
auto_fetch_phase_structures = true
reuse_fitted = true

[vacancies]
enabled = true

# -----------------------------------------------------------------------------
# Parent source, selection, and dedicated staged result tree
# -----------------------------------------------------------------------------
parent_source = "directory"
parent_directory = "vacancy-selected"

# Keep only the first/lowest-energy selected candidate for every composition.
# Use "all" to process every selected parent instead.
parent_pick = "lowest_energy"

# Optional composition or exact composition/candidate selectors. Common
# composition labels are matched independently of element order and 2.5/2p5
# notation. Remove parent_include entirely to process every discovered parent.
parent_include = [
    "Ti_2.5Sb_2.5",
    "Ti_2.5Sb_5",
    "Ru_2.5Sb_5",
    "Ce_2.5Sb_2.5",
    "Ce_2.5Sb_5",
    "Nb_2.5Sb_2.5",
    "Nb_5Sb_2.5",
    "Ta_2.5Sb_2.5",
    "Ta_5Sb_2.5",
    "Mn_2.5Sb_2.5",
    "Mn_2.5Sb_5",
    "Mn_2.5Sb_7.5",
    "In_2.5Sb_2.5",
    "In_2.5Sb_5",
    "In_2.5Sb_7.5",
    "In_5Sb_2.5",
    "In_5Sb_5",
    "In_5Sb_7.5",
    "In_7.5Sb_2.5",
    "In_7.5Sb_5",
    "In_7.5Sb_7.5",
]

# GRACE search artifacts and the later MACE finalization are both written here.
# The source parent tree remains untouched.
output_directory = "vacancy-mc-grace-mace"

include_parent_reference = true
skip_if_done = true
resume = true

# -----------------------------------------------------------------------------
# Chemistry and explicit vacancy research design
# -----------------------------------------------------------------------------
host_species = "Sn"
host_oxidation_state = 4
vacancy_species = "O"
vacancy_compensation_charge = 2
oxidation_state_elements = ["Sb", "Ti", "Ru", "Ce", "Nb", "Ta", "Mn", "In"]
oxidation_state_values = [
    [3, 5],
    [4],
    [4],
    [3, 4],
    [5],
    [5],
    [2, 3, 4],
    [3],
]

count_mode = "all_reachable"
extra_vacancies = 0
max_vacancies_cap = 2

# Explicit study counts override the charge-derived generation range.
vacancy_counts = [1, 2]

# The original 120-atom SnO2-based parent becomes a 960-atom search cell for a
# 2x2x2 replication (320 cations + 640 oxygen sites before removing vacancies).
supercell = [2, 2, 2]
symprec = 1.0e-3
angle_tolerance = 5.0
mapping_tolerance = 1.0
minimum_vacancy_distance = 0.0

# -----------------------------------------------------------------------------
# Stage 1: coupled cation/vacancy Monte Carlo with GRACE
# -----------------------------------------------------------------------------
search_method = "monte-carlo"
mc_backend = "grace"
mc_model = "GRACE-1L-OMAT"
mc_task = ""
mc_device = "cuda"
mc_gpu_id = 0

# Production-oriented schedule for the large coupled occupation space. The
# default library ceiling is intentionally smaller; set these explicitly for the
# 2x2x2 study. mc_max_steps includes hold + cooling + target-temperature steps.
mc_annealing = true
mc_initial_temperature_K = 1500.0
mc_annealing_hold_steps = 5000
mc_annealing_steps = 50000
mc_temperature_K = 600.0
mc_run_mode = "combined"
mc_max_steps = 200000

# In the current implementation patience is counted from step 1. Keep it larger
# than hold+ramp when the full annealing schedule must be completed.
mc_patience = 100000
mc_improvement_tolerance_eV = 1.0e-5
mc_energy_window_eV = 1.0
mc_cation_move_weight = 0.5
mc_vacancy_move_weight = 0.5
sample_seed = 42
sample_max_saved = 100

# -----------------------------------------------------------------------------
# Stage 2: final single points, relaxation, reranking, and thermodynamics by MACE
# -----------------------------------------------------------------------------
backend = "mace"
model = "mh-1"
task = "matpes_r2scan"
device = "cuda"
gpu_id = 0
n_workers = 1
tf_threads = 1
omp_threads = 1
chunksize = 25

# Stage 1 selects this many candidates independently for n=1 and n=2 according
# to GRACE search energy. Stage 2 runs MACE only on those selected structures.
topk_per_vacancy_count = 20
energy_normalization = "per_vacancy"
optimizer = "bfgs"
fmax = 0.05
max_steps = 300
relax_mode = "atoms"
cell_filter = "frechet"

# -----------------------------------------------------------------------------
# Vacancy thermodynamics
# -----------------------------------------------------------------------------
static_thermodynamic_analysis = true

# Opt in only after a compatible correction model has been fitted. When this is
# true, use a raw same-backend oxygen reference such as reference_file or
# same_calculator; do not combine with global/chemistry-specific calibration.
apply_fitted_energy_correction = false
allow_legacy_energy_correction_provenance = false

oxygen_reference_mode = "reference_file"
oxygen_reference_file = "reference_structures/reference_energies.json"
oxygen_reference_structure = "reference_structures/gas/O2.POSCAR"
oxygen_reference_relax = false
allow_unverified_oxygen_reference = false

# Monte Carlo does not provide an exact symmetry-orbit partition function.
# Use "none" or "ideal" here; "configurational" requires exact enumeration.
solid_configurational_entropy = "ideal"

delta_mu_O_min_eV = -3.0
delta_mu_O_max_eV = 0.0
delta_mu_O_points_eV = [0.0, -0.5, -1.0, -1.5, -2.0, -2.5, -3.0]
thermodynamic_tolerance_eV = 1.0e-8
static_energy_source = "relaxed_only"
exclude_unconverged = true

pressure_mapping = true
temperatures_K = [300.0, 353.0, 600.0, 900.0]
standard_oxygen_pressure_bar = 1.0
log10_pO2_min_bar = -20.0
log10_pO2_max_bar = 1.0
log10_pO2_step = 0.5
oxygen_standard_state_mode = "nist_shomate"
oxygen_standard_state_temperatures_K = []
oxygen_standard_state_delta_mu_eV_per_O = []
