# Step 16: electrochemical surface states / surface Pourbaix
# Surface segregation is optional; direct Surface-stage output is the default.
[surface_pourbaix]
enabled = true
source_mode = "surface"               # best available direct Surface-stage table
source_summary = ""
surface_include = []
max_surfaces = 10
outdir = "10_surface_pourbaix"

# Sample both coverage and arrangement. "clean" is always retained as the reference.
# Automatic side selection is evaluated independently for every actual doped surface.
placement_side = "dopant-nearest"     # dopant-nearest, top, bottom, both
side_target_species = ["Sb", "In"]    # blank/[] -> infer all non-host cations
dopant_side_tie_tolerance_A = 0.25
dopant_side_fallback = "top"

anion_species = ["O"]
state_families = ["clean", "protonated", "O", "OH", "H2O", "mixed-O-OH"]

# Coverages are percentages of the eligible sites on the selected surface side.
proton_coverages_pct = [25, 50, 75, 100]
o_coverages_pct = [25, 50, 75, 100]
oh_coverages_pct = [25, 50, 75, 100]
h2o_coverages_pct = [25, 50, 100]
mixed_coverages_pct = [[25, 25], [25, 75], [50, 50], [75, 25]]

surface_window_A = 2.0
max_surface_oxygen_sites = 0          # 0 = all eligible sites
max_surface_cation_sites = 0          # 0 = all eligible sites

# Symmetry is determined from the actual doped/vacancy slab.
symmetry_reduce = true
symmetry_symprec_A = 0.10
symmetry_angle_tolerance_deg = 5.0
symmetry_mapping_tolerance_A = 0.25
max_raw_configurations_per_stoichiometry = 100000
max_arrangements_per_stoichiometry = 8

oh_bond_length_A = 0.98
adsorbate_height_A = 1.85

# Requested PEM-relevant pH window. SHE gives the conventional pH-sloped map.
temperature_K = 298.15
potential_scale = "SHE"              # SHE or RHE
potential_min_V = 0.0
potential_max_V = 2.0
potential_step_V = 0.05
pH_min = -1.0
pH_max = 3.0
pH_step = 0.1

# H2/H2O are calculated with the screening backend unless manual values are supplied.
compute_references = true
reference_relax = true
reference_box_A = 15.0
manual_h2_energy_eV = ""
manual_h2o_energy_eV = ""
h2_free_energy_correction_eV = 0.0
h2o_free_energy_correction_eV = 0.0
resume_completed = true
inherit_surface_fixed_atoms = true

[surface_pourbaix.screen]
backend = "mace"
model = "mh-1"
task = "matpes_r2scan"
device = "cpu"
relax = true
optimizer = "bfgs"
fmax = 0.05
max_steps = 300

# Optional DFT refinement of ML-competitive states only.
[surface_pourbaix.dft]
enabled = false
execute = false
max_states_per_surface = 20
candidate_window_eV = 0.30
code = "gpaw"
mode = "pw"
xc = "PBE"
ecut_eV = 500.0
kpts = [3, 3, 1]
gamma = true
smearing_eV = 0.05
convergence_density = 1e-5
maxiter = 333
spinpol = "auto"
save_wavefunctions = false
reuse_existing = true
cache_root = "dft_cache"
fail_fast = false
