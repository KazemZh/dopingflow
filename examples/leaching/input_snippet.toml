# Run after `dopingflow surface`.
[leaching]
enabled = true
# Optional override; otherwise inherits [surface].source_root.
source_root = "vacancy-selected/structures-analysis"
source_mode = "auto"
zones = ["surface"]
dopant_species = []                 # infer from surface metadata
surface_include = []                # optional target/surface wildcards
outdir = "09_leaching"                  # -> <source_root>/09_leaching

# Normally inherit the enabled [surface.refine] calculator.
backend = "mace"
model = "mh-1"
task = "matpes_r2scan"
device = "cuda"
gpu_id = 0
optimizer = "bfgs"
fmax = 0.03
max_steps = 500

reuse_surface_energy = true
relax_parent_if_recomputed = true
relax_removed_surface = true
inherit_surface_fixed_atoms = true
resume_completed = true              # skip compatible completed sites on restart

reference_energies_file = "reference_structures/reference_energies.json"
metals_dir = "reference_structures/metals"
compute_missing_metal_references = true
relax_metal_reference = false

# Extraction-energy screening works without aqueous redox data.
# Add only chemically validated values for the species being modeled.
# oxidation_states = { Sb = 3, Ti = 3 }
# standard_reduction_potentials_V_SHE = { Sb = <validated>, Ti = <validated> }
# aqueous_species = { Sb = "...", Ti = "..." }
# ion_activities = { Sb = 1e-6, Ti = 1e-6 }

default_ion_activity = 1e-6
temperature_K = 298.15
pH = 0.0
potential_scale = "RHE"
potentials_V = [1.23, 1.50, 1.70]


# Optional: stabilize the dopant-vacancy surface by protonating O atoms that
# were bonded to the removed dopant. The bare vacancy remains in the results.
[leaching.protonation]
enabled = false
h_counts = [0, 1, 2, 3]
neighbor_cutoff_A = 2.8
oh_bond_length_A = 0.98
max_arrangements_per_h_count = 5
relax_protonated_surface = true

# H2 is calculated with the same leaching MLFF and cached.
compute_h2_reference = true
relax_h2_reference = true
h2_bond_length_A = 0.74
h2_box_A = 15.0
# manual_h2_energy_eV = -6.8   # optional override
